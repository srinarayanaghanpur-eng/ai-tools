# Netlify deploy config for the TOOLVERSE AI frontend.
# In Netlify: New site from Git → repo ai-tools → Base directory: toolverse-ai-frontend
# Build command + publish below are auto-detected, but explicit is safer.
[build]
  base = "toolverse-ai-frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next.js Runtime handles SSR/ISR — publish stays .next, functions are generated automatically.

# Long-cache immutable Next.js assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers (CSP kept permissive for AdSense + backend API calls).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
